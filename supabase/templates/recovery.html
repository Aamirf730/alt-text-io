<!doctype html>
<html lang="en">
  <body style="margin:0;background:#FFFBEA;font-family:Arial,'Helvetica Neue',sans-serif;color:#3F3F46;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#FFFBEA;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #EFE3A3;border-radius:16px;background:#FFFFFF;overflow:hidden;">
            <tr>
              <td style="padding:32px 36px 8px;text-align:center;">
                <img src="https://www.alt-text.pro/logo-alt-text-pro.png" width="72" height="72" alt="Alt Text Pro" style="display:inline-block;width:72px;height:72px;border:0;">
              </td>
            </tr>
            <tr>
              <td style="padding:12px 36px 36px;text-align:center;">
                <h1 style="margin:0 0 16px;font-size:26px;line-height:1.3;font-weight:700;color:#3F3F46;">Reset your password</h1>
                <p style="margin:0 auto 28px;max-width:420px;font-size:16px;line-height:1.6;color:#6B6B73;">
                  Use this link to choose a new password for your Alt Text Pro account. It works on any device.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next={{ .RedirectTo | urlquery }}" style="display:inline-block;border-radius:12px;background:#FEE11C;padding:14px 28px;font-size:16px;font-weight:700;line-height:1;text-decoration:none;color:#3F3F46;">
                  Choose a new password
                </a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#6B6B73;">
                  If you did not ask to reset your password, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#6B6B73;">Alt Text Pro &middot; AI alt text for WordPress</p>
        </td>
      </tr>
    </table>
  </body>
</html>
