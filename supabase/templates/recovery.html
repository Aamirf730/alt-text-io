<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f8fafc;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #e2e8f0;border-radius:20px;background:#ffffff;overflow:hidden;">
            <tr>
              <td style="padding:36px 36px 10px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:#000000;">Alt Text Pro</div>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 36px 36px;text-align:center;">
                <h1 style="margin:0 0 16px;font-size:28px;line-height:1.25;color:#000000;">Reset your password</h1>
                <p style="margin:0 auto 28px;max-width:420px;font-size:16px;line-height:1.6;color:#475569;">
                  Use this link to choose a new password for your Alt Text Pro account. It works on any device.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next={{ .RedirectTo | urlquery }}" style="display:inline-block;border-radius:12px;background:#FEE11C;padding:14px 24px;font-size:16px;font-weight:700;text-decoration:none;color:#000000;">
                  Choose a new password
                </a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#94a3b8;">
                  If you did not ask to reset your password, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
