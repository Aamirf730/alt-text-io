[build]
  base = "."
  publish = "frontend-next/.next"
  command = "cd wordpress-plugin && ./build-plugin.sh && cd ../netlify-functions && npm install && cd ../frontend-next && npm install && npm run build"
  functions = "netlify-functions"

[dev]
  port = 9999
  targetPort = 3000
  watch = ["netlify-functions"]
  command = "npm run dev --prefix frontend-next"

[build.environment]
  NODE_VERSION = "20"
  # These environment variables will be pulled from Netlify dashboard
  # NEXT_PUBLIC_SUPABASE_URL
  # NEXT_PUBLIC_SUPABASE_ANON_KEY
  # NEXT_PUBLIC_PAYPAL_CLIENT_ID

[functions."daily-funnel-report"]
  # Runs daily at 08:30 Asia/Kolkata. Netlify schedules use UTC.
  schedule = "0 3 * * *"

[functions."lifecycle-automation"]
  # Runs every two hours. Netlify schedules use UTC.
  schedule = "0 */2 * * *"

# Specific redirects for legacy Netlify Functions (preserve access for Plugin/Dashboard)
[[redirects]]
  from = "/api/generate-alt-text"
  to = "/.netlify/functions/generate-alt-text"
  status = 200

[[redirects]]
  from = "/api/auth-validate"
  to = "/.netlify/functions/auth-validate"
  status = 200

[[redirects]]
  from = "/api/get-api-key"
  to = "/.netlify/functions/get-api-key"
  status = 200

[[redirects]]
  from = "/api/get-usage"
  to = "/.netlify/functions/get-usage"
  status = 200

[[redirects]]
  from = "/api/get-subscription"
  to = "/.netlify/functions/get-subscription"
  status = 200

[[redirects]]
  from = "/api/get-plans"
  to = "/.netlify/functions/get-plans"
  status = 200

[[redirects]]
  from = "/api/track-event"
  to = "/.netlify/functions/track-event"
  status = 200

[[redirects]]
  from = "/api/admin-get-users"
  to = "/.netlify/functions/admin-get-users"
  status = 200

[[redirects]]
  from = "/api/admin-marketing-funnel"
  to = "/.netlify/functions/admin-marketing-funnel"
  status = 200

[[redirects]]
  from = "/api/delete-users"
  to = "/.netlify/functions/delete-users"
  status = 200

[[redirects]]
  from = "/api/send-contact-email"
  to = "/.netlify/functions/send-contact-email"
  status = 200

[[redirects]]
  from = "/api/activate-subscription"
  to = "/.netlify/functions/activate-subscription"
  status = 200

# Next.js plugin handles everything else (including new /api/checkout)
[[plugins]]
  package = "@netlify/plugin-nextjs"
