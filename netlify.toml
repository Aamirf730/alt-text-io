[build]
  publish = "frontend/build"
  command = "cd frontend && yarn build"
  functions = "netlify-functions"

[build.environment]
  NODE_VERSION = "18"
  # These environment variables will be pulled from Netlify dashboard
  # REACT_APP_SUPABASE_URL
  # REACT_APP_SUPABASE_ANON_KEY
  # REACT_APP_BACKEND_URL

# SPA fallback for React Router - this is crucial for fixing 404 errors
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect all API calls to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Environment variables (set in Netlify dashboard)
# SUPABASE_URL=your_supabase_project_url
# SUPABASE_ANON_KEY=your_supabase_anon_key  
# SUPABASE_SERVICE_ROLE_KEY=your_supabase_service_role_key
# GEMINI_API_KEY=your_gemini_api_key
# REACT_APP_SUPABASE_URL=your_supabase_project_url
# REACT_APP_SUPABASE_ANON_KEY=your_supabase_anon_key 