  <path clip-path="url(#disc)" d="M230 600 C 260 450, 330 372, 440 330 C 520 300, 640 270, 760 300" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- orb -->
  <circle cx="802" cy="214" r="58" fill="url(#orb)" stroke="#FEE11C" stroke-width="8"/>
  <ellipse cx="788" cy="196" rx="20" ry="12" fill="#FFFFFF" opacity="0.9"/>
  <!-- wordmark -->
  <text x="512" y="560" text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="210" letter-spacing="2" fill="#3F3F46">ALT</text>
  <text x="512" y="672" text-anchor="middle" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="92" letter-spacing="4" fill="#3F3F46">TEXT PRO</text>
